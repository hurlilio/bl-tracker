services:
  # Backend API
  - type: web
    name: bl-tracker-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://bl-tracker-frontend.onrender.com
      - key: DB_HOST
        fromDatabase:
          name: bl-tracker-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: bl-tracker-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: bl-tracker-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: bl-tracker-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: bl-tracker-db
          property: database

  # Frontend (Vue.js) - USANDO type: web
  - type: web
    name: bl-tracker-frontend
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run preview -- --port 10000 --host 0.0.0.0
    envVars:
      - key: VITE_API_URL
        value: https://bl-tracker-backend.onrender.com/api

databases:
  - name: bl-tracker-db
    plan: free
    databaseName: bltracker
    user: postgres