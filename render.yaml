services:
  - type: web
    name: bl-tracker-backend
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://bl-tracker-frontend.onrender.com
      - key: DB_HOST
        fromDatabase:
          name: bl-tracker-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: bl-tracker-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: bl-tracker-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: bl-tracker-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: bl-tracker-db
          property: database

  - type: web
    name: bl-tracker-frontend
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: VITE_API_URL
        value: https://bl-tracker-backend.onrender.com/api

databases:
  - name: bl-tracker-db
    plan: free
    databaseName: bltracker
    user: postgres